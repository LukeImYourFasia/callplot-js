name: ci

on:
  push:
    branches: ["**"]
  schedule:
    - cron: "0 18 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run coverage
      - run: npm pack --dry-run
      - run: npm audit --audit-level=high

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - run: npm run test:browser

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: apt
      - run: |
          [ -d test/snapshots ] || { echo "no snapshots yet (before W12)"; exit 0; }
          mkdir -p /tmp/mmdc-out
          for f in test/snapshots/*.mmd; do npx -y --proxy=null mmdc -i "$f" -o /tmp/mmdc-out/out.png; done
      - run: |
          [ -d test/snapshots ] || { echo "no snapshots yet (before W13)"; exit 0; }
          java -jar reference/plantuml.jar -checkonly test/snapshots/*.puml

  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: apt
      # The callplot classes ship pre-compiled (reference/build, JDK 1.8,
      # forward-compatible); only FuzzOracle must be built, per tools/oracle/README.md.
      - run: javac -nowarn -d reference/build-tools tools/oracle/FuzzOracle.java
      - run: npm run fuzz -- --seed 1 --count 2000
